name: Nightly Eval

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eval:
    name: Gold-set evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Start infrastructure
        run: docker compose up -d postgres redis qdrant
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for postgres..."
          timeout 60 bash -c 'until docker exec fraudlens-postgres pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}; do sleep 2; done'
          echo "Waiting for redis..."
          timeout 30 bash -c 'until docker exec fraudlens-redis redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG; do sleep 2; done'
          echo "All services healthy."
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

      - name: Run Alembic migrations
        run: uv run alembic upgrade head
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_HOST: localhost
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_HOST: localhost
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_HOST: localhost

      - name: Start API server
        run: |
          uv run uvicorn fraudlens.api.main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for API to be ready..."
          timeout 60 bash -c 'until curl -sf http://localhost:8000/health; do sleep 2; done'
          echo "API is ready."
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_HOST: localhost
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_HOST: localhost
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_HOST: localhost

      - name: Run gold-set eval
        run: uv run tests/eval/run_eval.py --base-url http://localhost:8000 --concurrency 3
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}
          path: tests/eval/results/
          retention-days: 30

      - name: Shut down infrastructure
        if: always()
        run: docker compose down -v
